<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Light Cloud Browser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="browser-window">
    <!-- ブラウザヘッダー・ツールバー -->
    <header class="browser-toolbar">
      <div class="nav-controls">
        <button id="btn-back" title="戻る (Alt+Left)"><i class="fa-solid fa-arrow-left"></i></button>
        <button id="btn-forward" title="進む (Alt+Right)"><i class="fa-solid fa-arrow-right"></i></button>
        <button id="btn-reload" title="更新 (Ctrl+R / F5)"><i class="fa-solid fa-rotate-right"></i></button>
      </div>

      <div class="address-bar-wrapper">
        <i class="fa-solid fa-lock ssl-icon"></i>
        <input type="text" id="url-bar" placeholder="URLを入力、またはGoogle検索..." spellcheck="false" autocomplete="off">
        <button id="btn-go" title="移動"><i class="fa-solid fa-arrow-turn-down fa-rotate-90"></i></button>
      </div>

      <div class="action-controls">
        <!-- 画質調整スライダー -->
        <div class="quality-control" title="画質 / 転送レート設定">
          <i class="fa-solid fa-sliders"></i>
          <span id="quality-label">80%</span>
          <input type="range" id="quality-slider" min="30" max="100" value="80" step="5">
        </div>

        <!-- レイテンシ / FPS表示 -->
        <div class="stats-badge" title="リアルタイムPingレイテンシ & FPS">
          <span class="status-dot"></span>
          <span id="ping-text">-- ms</span>
          <span class="divider">|</span>
          <span id="fps-text">-- fps</span>
        </div>

        <!-- 画面解像度同期・フルスクリーン -->
        <button id="btn-fullscreen" title="全画面表示"><i class="fa-solid fa-expand"></i></button>
      </div>
    </header>

    <!-- メインのブラウザ表示画面 (Canvas) -->
    <main class="viewport-container" id="viewport-container">
      <canvas id="browser-canvas" tabindex="0"></canvas>
      
      <!-- ローディング/接続オーバーレイ -->
      <div id="loading-overlay" class="overlay">
        <div class="spinner"></div>
        <p id="loading-text">クラウドブラウザを起動中...</p>
      </div>
    </main>

    <!-- クイックショートカットフッター -->
    <footer class="browser-footer">
      <div class="footer-left">
        <span class="tip-tag">ヒント</span>
        <span>直接クリック・スクロール・文字入力ができます（クリックするとキー入力フォーカス）</span>
      </div>
      <div class="footer-right">
        <span id="resolution-text">1280 × 800</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>

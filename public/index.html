<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Light Cloud Browser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="browser-window">
    <!-- ツールバー -->
    <header class="browser-toolbar">
      <div class="nav-controls">
        <button id="btn-back" title="戻る"><i class="fa-solid fa-arrow-left"></i></button>
        <button id="btn-forward" title="進む"><i class="fa-solid fa-arrow-right"></i></button>
        <button id="btn-reload" title="更新"><i class="fa-solid fa-rotate-right"></i></button>
      </div>

      <!-- アドレスバー -->
      <div class="address-bar-wrapper">
        <i class="fa-solid fa-lock ssl-icon"></i>
        <input type="text" id="url-bar" placeholder="URLまたは検索キーワードを入力..." spellcheck="false" autocomplete="off">
        <button id="btn-go" title="移動"><i class="fa-solid fa-arrow-turn-down fa-rotate-90"></i></button>
      </div>

      <!-- かな文字・日本語クイック入力バー -->
      <div class="ime-bar-wrapper" title="クリックした場所に日本語（かな・漢字）を直接入力して送信">
        <i class="fa-solid fa-keyboard ime-icon"></i>
        <input type="text" id="ime-text-bar" placeholder="日本語・かな入力..." autocomplete="off">
        <button id="btn-ime-send" title="送信 (Enter)"><i class="fa-solid fa-paper-plane"></i></button>
      </div>

      <!-- コントロール -->
      <div class="action-controls">
        <!-- 音声コントロール -->
        <div class="audio-control" title="リアルタイム音声再生">
          <button id="btn-audio-toggle" title="音声ミュート/解除"><i class="fa-solid fa-volume-high"></i></button>
          <input type="range" id="volume-slider" min="0" max="100" value="100" title="音量調節">
        </div>

        <div class="quality-control" title="画質・速度設定">
          <i class="fa-solid fa-sliders"></i>
          <span id="quality-label">35% (超高速 60FPS)</span>
          <input type="range" id="quality-slider" min="20" max="100" value="35" step="5">
        </div>

        <div class="stats-badge" title="Pingレイテンシ & FPS">
          <span class="status-dot"></span>
          <span id="ping-text">-- ms</span>
          <span class="divider">|</span>
          <span id="fps-text">-- fps</span>
        </div>

        <button id="btn-fullscreen" title="全画面表示"><i class="fa-solid fa-expand"></i></button>
      </div>
    </header>

    <!-- メイン表示領域 (Canvas) -->
    <main class="viewport-container" id="viewport-container">
      <canvas id="browser-canvas" tabindex="0"></canvas>
      <!-- 日本語IME・文字入力用レイヤー -->
      <textarea id="ime-hidden-input" class="ime-hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      
      <!-- ローディングオーバーレイ -->
      <div id="loading-overlay" class="overlay">
        <div class="spinner"></div>
        <p id="loading-text">クラウドブラウザに接続中...</p>
      </div>
    </main>

    <!-- フッター -->
    <footer class="browser-footer">
      <div class="footer-left">
        <span class="tip-tag">リアルタイム音声</span>
        <span>YouTubeや動画・音声コンテンツのサウンドがWeb Audio経由でリアルタイムに再生されます</span>
      </div>
      <div class="footer-right">
        <span id="resolution-text">1280 × 800</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>

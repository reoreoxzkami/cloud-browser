services:
  cloud-browser:
    build: .
    container_name: ultra-light-cloud-browser
    ports:
      - "3000:3000"
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      - PORT=3000
      - CHROME_PATH=/usr/bin/chromium
      - NODE_ENV=production

  # Cloudflare Named Tunnel (24時間常時稼働用)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-named-tunnel
    restart: unless-stopped
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      - cloud-browser
    profiles:
      - tunnel